<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQ Lark 签名生成器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #3370ff; --primary-hover: #2855d6; --primary-light: #e1ebff;
  --bg: #f5f6f7; --card: #fff;
  --text: #1f2329; --text-2: #646a73; --text-3: #8f959e;
  --border: #e6e8eb; --border-hover: #d5d8db;
  --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.03);
  --feishu-blue-filter: brightness(0) invert(40%) sepia(78%) saturate(3148%) hue-rotate(218deg) brightness(99%) contrast(102%);
}
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; padding: 32px 16px; }
.container { max-width: 980px; margin: 0 auto; }
header { margin-bottom: 24px; text-align: center; }
h1 { font-size: 24px; font-weight: 600; margin-bottom: 6px; }
header p { color: var(--text-2); font-size: 13px; }
.layout { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
.card { background: var(--card); border-radius: 14px; padding: 22px; box-shadow: var(--shadow); }
.field { margin-bottom: 14px; }
label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; }
input[type="date"], input[type="text"], select {
  width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 14px; font-family: inherit; background: white; color: var(--text); transition: border-color 0.15s;
}
input[type="date"], select { cursor: pointer; }
input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px;
  max-height: 260px; overflow-y: auto; padding: 8px;
  background: #fafbfc; border: 1px solid var(--border); border-radius: 8px; margin-top: 4px; }
.icon-grid::-webkit-scrollbar { width: 6px; }
.icon-grid::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }
.icon-item { aspect-ratio: 1; border: 1.5px solid transparent; border-radius: 6px;
  cursor: pointer; background: white; display: flex; align-items: center; justify-content: center;
  padding: 5px; transition: all 0.15s; }
.icon-item:hover { border-color: var(--border-hover); }
.icon-item.selected { border-color: var(--primary); background: var(--primary-light); }
.icon-img { width: 100%; height: 100%; object-fit: contain; filter: var(--feishu-blue-filter); }
.icon-item.no-icon { font-size: 11px; color: var(--text-3); text-align: center; padding: 4px; }
button { width: 100%; padding: 11px 16px; border: 0; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; font-family: inherit; transition: all 0.15s; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-hover); }
details { margin-top: 12px; font-size: 12px; color: var(--text-3); }
details summary { cursor: pointer; user-select: none; padding: 6px 0; list-style: none; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "▸ "; }
details[open] summary::before { content: "▾ "; }
.url-box { background: #fafbfc; border: 1px solid var(--border); padding: 10px 12px; border-radius: 8px;
  font-family: "SF Mono", Monaco, monospace; font-size: 11px; line-height: 1.5;
  word-break: break-all; max-height: 80px; overflow-y: auto; color: var(--text-2); margin: 6px 0; }
.preview-card { padding: 0; overflow: hidden; position: sticky; top: 32px; align-self: start; }
.cover { height: 110px; background: linear-gradient(120deg, #b3d2fa 0%, #c5e1f0 50%, #d4d9f1 100%); }
.profile-body { padding: 0 22px 22px; position: relative; margin-top: -36px; }
.avatar { width: 72px; height: 72px; border-radius: 50%; background: white; border: 4px solid white;
  display: flex; align-items: center; justify-content: center; font-size: 36px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
.profile-name { font-size: 19px; font-weight: 600; margin-top: 14px; color: var(--text); }
.profile-bio {
  display: flex; align-items: center; gap: 5px;
  margin-top: 6px; font-size: 14px; color: var(--text-2);
  flex-wrap: wrap; word-break: break-all; min-height: 22px;
}
.bio-icon-display { width: 16px; height: 16px; object-fit: contain; filter: var(--feishu-blue-filter);
  flex-shrink: 0; display: none; }
.bio-icon-display.visible { display: inline-block; }
.bio-text { letter-spacing: 0.3px; }
.copy-action { margin-top: 18px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: rgba(31, 35, 41, 0.92); color: white; padding: 10px 18px; border-radius: 8px;
  font-size: 13px; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100; }
.toast.visible { opacity: 1; }
.footer { font-size: 11px; color: var(--text-3); text-align: center; margin-top: 24px; }
.footer a { color: var(--text-3); text-decoration: none; }
.loading { padding: 28px; text-align: center; color: var(--text-3); font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>飞书签名生成器</h1>
    <p>选样式、写文案、挑图标 → 复制 → 粘到你的签名栏</p>
  </header>
  <div class="layout">
    <div class="card builder">
      <div class="field">
        <label>入职日期</label>
        <input type="date" id="date" value="2025-04-28">
      </div>
      <div class="field">
        <label>样式</label>
        <select id="template">
          <option value="symbols">纯符号（最简洁,搭配前缀文字）</option>
          <option value="fullDay">升级文案 · 按 30.44 天算（精确到日）</option>
          <option value="fullMonth">升级文案 · 按月数算（自然月）</option>
        </select>
      </div>
      <div class="field">
        <label>前缀文字（拼在最前,可留空）</label>
        <input type="text" id="prefix" placeholder="留空 / Lv. / 💎 Lv. / 🦞 " value="Lv. ">
      </div>
      <div class="field">
        <label>图标分类</label>
        <select id="category"><option value="">加载中...</option></select>
      </div>
      <div class="icon-grid" id="icon-grid">
        <div class="loading">加载中...</div>
      </div>
    </div>
    <div class="card preview-card">
      <div class="cover"></div>
      <div class="profile-body">
        <div class="avatar">🦞</div>
        <h2 class="profile-name">你的名字</h2>
        <div class="profile-bio">
          <img class="bio-icon-display" id="bio-icon" alt="">
          <span class="bio-text" id="bio-text">⭐</span>
        </div>
        <button class="btn-primary copy-action" id="copy-action">复制签名</button>
        <details>
          <summary>查看生成的 URL</summary>
          <div class="url-box" id="url-box">点击"复制签名"后生成</div>
        </details>
      </div>
    </div>
  </div>
  <p class="footer">Powered by <a href="https://github.com/CancerGary/lark-url-preview-public-next" target="_blank">lark-url-preview</a></p>
</div>
<div class="toast" id="toast">已复制</div>

<script type="module">
import basex from 'https://esm.sh/base-x@5';

const TARGET_URL = 'https://bytedance.larkoffice.com/docx/ObywdEyRVoGVHgx6EuZcSlEHn5g';
const PRESETS_URL = 'https://raw.githubusercontent.com/CancerGary/lark-url-preview-presets/main/data.json';
const IMG_BASE = 'https://open.feishu.cn/open-apis/block-kit/image/';

const bs62 = basex('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz');

const SYMBOLS_HBS = `{{#if (gte (divide months 36) 1)}}👑{{/if}}{{#if (gte (divide months 72) 1)}}👑{{/if}}{{#if (gte (divide months 108) 1)}}👑{{/if}}{{#if (gte (divide (modulo months 36) 12) 1)}}☀️{{/if}}{{#if (gte (divide (modulo months 36) 12) 2)}}☀️{{/if}}{{#if (eq (divide (modulo months 36) 12) 3)}}☀️{{/if}}{{#if (gte (divide (modulo months 12) 3) 1)}}🌙{{/if}}{{#if (gte (divide (modulo months 12) 3) 2)}}🌙{{/if}}{{#if (gte (divide (modulo months 12) 3) 3)}}🌙{{/if}}{{#if (gte (modulo months 3) 1)}}⭐{{/if}}{{#if (gte (modulo months 3) 2)}}⭐{{/if}}`;

const SYMBOLS_HBS_DAY = `{{#if (gte (divide months 36) 1)}}👑{{/if}}{{#if (gte (divide months 36) 2)}}👑{{/if}}{{#if (gte (divide months 36) 3)}}👑{{/if}}{{#if (gte (divide (modulo months 36) 12) 1)}}☀️{{/if}}{{#if (gte (divide (modulo months 36) 12) 2)}}☀️{{/if}}{{#if (eq (divide (modulo months 36) 12) 3)}}☀️{{/if}}{{#if (gte (divide (modulo months 12) 3) 1)}}🌙{{/if}}{{#if (gte (divide (modulo months 12) 3) 2)}}🌙{{/if}}{{#if (gte (divide (modulo months 12) 3) 3)}}🌙{{/if}}{{#if (gte (modulo months 3) 1)}}⭐{{/if}}{{#if (gte (modulo months 3) 2)}}⭐{{/if}}`;

const BUILD = {
  symbols: (date, prefix) =>
    `${prefix}{{#with (time_diff m="from" t="${date}" f="M") as |months|}}${SYMBOLS_HBS}{{/with}}`,
  fullDay: (date, prefix) =>
    `${prefix}{{#with (time_diff m="from" t="${date}" f="d") as |totalDays|}}{{#with (floor (divide totalDays 30.44)) as |currentLevel|}}{{currentLevel}} {{#with (divide totalDays 30.44) as |months|}}${SYMBOLS_HBS_DAY}{{/with}}{{#with (add currentLevel 1) as |nextLevel|}}{{#with (ceil (subtract (multiply nextLevel 30.44) totalDays)) as |daysLeft|}} (还需要 {{daysLeft}} 天升级至 Lv.{{nextLevel}}){{/with}}{{/with}}{{/with}}{{/with}}`,
  fullMonth: (date, prefix) =>
    `${prefix}{{#with (time_diff m="from" t="${date}" f="M") as |months|}}{{months}} ${SYMBOLS_HBS}{{/with}} (还需要 {{#with (time_diff m="from" t="${date}" f="d") as |days|}}{{subtract 30 (modulo days 30)}}{{/with}} 天升级至 Lv.{{add (time_diff m="from" t="${date}" f="M") 1}})`,
};

const renderSymbols = (m) => {
  if (m < 1) return '⭐';
  return ('👑'.repeat(Math.floor(m/36)) + '☀️'.repeat(Math.floor((m%36)/12))
    + '🌙'.repeat(Math.floor((m%12)/3)) + '⭐'.repeat(m%3)) || '⭐';
};

const renderPreview = (template, date, prefix) => {
  const start = new Date(date);
  if (isNaN(start)) return prefix + '⭐';
  const now = new Date();
  const totalDays = Math.floor((now - start) / 86400000);
  const calMonths = (now.getFullYear() - start.getFullYear()) * 12 + (now.getMonth() - start.getMonth());
  const dayLevel = Math.floor(totalDays / 30.44);

  if (template === 'fullDay') {
    const nextLevel = dayLevel + 1;
    const daysLeft = Math.ceil(nextLevel * 30.44 - totalDays);
    return `${prefix}${dayLevel} ${renderSymbols(dayLevel)} (还需要 ${daysLeft} 天升级至 Lv.${nextLevel})`;
  } else if (template === 'fullMonth') {
    const daysLeft = 30 - (totalDays % 30);
    return `${prefix}${calMonths} ${renderSymbols(calMonths)} (还需要 ${daysLeft} 天升级至 Lv.${calMonths + 1})`;
  }
  return prefix + renderSymbols(calMonths);
};

const $ = (id) => document.getElementById(id);
let selectedKey = '', currentUrl = '', presets = [];

const updateBio = () => {
  const prefix = $('prefix').value || '';
  $('bio-text').textContent = renderPreview($('template').value, $('date').value, prefix);
  const icon = $('bio-icon');
  if (selectedKey) { icon.src = IMG_BASE + selectedKey; icon.classList.add('visible'); }
  else { icon.classList.remove('visible'); }
};

['date', 'prefix'].forEach(id => $(id).addEventListener('input', updateBio));
$('template').addEventListener('change', updateBio);

const renderIcons = (categoryIdx) => {
  const grid = $('icon-grid');
  grid.innerHTML = '';
  const noIcon = document.createElement('div');
  noIcon.className = 'icon-item no-icon' + (selectedKey === '' ? ' selected' : '');
  noIcon.textContent = '默认';
  noIcon.onclick = () => { selectedKey = ''; renderIcons(categoryIdx); updateBio(); };
  grid.appendChild(noIcon);
  if (categoryIdx === '' || !presets[categoryIdx]) return;
  presets[categoryIdx].images.forEach(img => {
    const el = document.createElement('div');
    el.className = 'icon-item' + (selectedKey === img.key ? ' selected' : '');
    el.title = img.description || '';
    const inner = document.createElement('img');
    inner.className = 'icon-img';
    inner.loading = 'lazy';
    inner.alt = '';
    inner.src = IMG_BASE + img.key;
    el.appendChild(inner);
    el.onclick = () => { selectedKey = img.key; renderIcons(categoryIdx); updateBio(); };
    grid.appendChild(el);
  });
};

fetch(PRESETS_URL).then(r => r.json()).then(data => {
  presets = data.result;
  const sel = $('category');
  sel.innerHTML = '<option value="">— 选择分类 —</option>'
    + presets.map((c, i) => `<option value="${i}">${c.name}</option>`).join('');
  sel.addEventListener('change', e => renderIcons(e.target.value));
  sel.value = '0';
  renderIcons('0');
}).catch(() => { $('icon-grid').innerHTML = `<div class="loading">图标库加载失败</div>`; });

const buildUrl = (template, date, prefix) => {
  const text = BUILD[template](date, prefix);
  const t2 = bs62.encode(new TextEncoder().encode(text));
  const params = new URLSearchParams();
  if (selectedKey) params.set('k', selectedKey);
  params.set('t2', t2);
  params.set('u', TARGET_URL);
  return `https://cgth.ink/?${params.toString()}`;
};

const showToast = (msg) => {
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 1800);
};

$('copy-action').addEventListener('click', async () => {
  const date = $('date').value;
  if (!date) { showToast('请先选择入职日期'); return; }
  currentUrl = buildUrl($('template').value, date, $('prefix').value || '');
  $('url-box').textContent = currentUrl;
  try {
    await navigator.clipboard.writeText(currentUrl);
    showToast('✓ 已复制,粘贴到飞书"创意个性签名"');
  } catch { showToast('复制失败,请展开 URL 手动复制'); }
});

updateBio();
</script>
</body>
</html>
