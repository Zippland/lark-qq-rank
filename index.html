<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<title>飞书签名生成器</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
:root {
  --primary: #3370ff; --primary-hover: #2860e1; --primary-light: #eaf1ff;
  --link: #3370ff;
  --bg: #f7f8fa; --card: #ffffff;
  --ink: #1f2329; --ink-2: #51565d; --ink-3: #8f959e;
  --line: #e9ebf0; --line-2: #dfe1e6;
  --feishu-blue-filter: brightness(0) saturate(100%) invert(36%) sepia(92%) saturate(2330%) hue-rotate(212deg) brightness(101%) contrast(101%);
  --radius: 16px;
  --shadow-sm: 0 1px 2px rgba(20,28,48,.04);
  --shadow: 0 6px 24px -8px rgba(20,28,48,.12), 0 2px 6px rgba(20,28,48,.04);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
html, body { background: var(--bg); }
body { font-family: var(--font); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding: 40px 20px 64px; }
.wrap { max-width: 1040px; margin: 0 auto; }

/* ---------- header ---------- */
header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
  flex-wrap: wrap; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 38px; height: 38px; border-radius: 11px; flex-shrink: 0;
  background: linear-gradient(150deg, #4e86ff, #3370ff); display: grid; place-items: center;
  box-shadow: 0 6px 14px -4px rgba(51,112,255,.5); }
.brand-mark svg { width: 21px; height: 21px; }
.brand h1 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
.brand p { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; }

/* segmented control */
.seg { display: inline-flex; gap: 3px; background: #eef0f4; border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: transparent; cursor: pointer; font-family: inherit;
  font-size: 13.5px; font-weight: 550; color: var(--ink-2); padding: 8px 18px; border-radius: 9px;
  transition: color .18s, background .18s, box-shadow .18s; }
.seg button.active { background: var(--card); color: var(--primary); box-shadow: var(--shadow-sm); }
.seg button:not(.active):hover { color: var(--ink); }
.seg button:focus-visible,
.btn-primary:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }

/* ---------- layout ---------- */
.grid { display: grid; grid-template-columns: 1.02fr .98fr; gap: 20px; align-items: start; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); }
.panel-pad { padding: 22px; }

/* ---------- form ---------- */
.field { margin-bottom: 16px; }
.field:last-child { margin-bottom: 0; }
label { display: block; font-size: 12px; font-weight: 550; color: var(--ink-2);
  margin-bottom: 7px; letter-spacing: .01em; }
.input, textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px;
  font-size: 14px; font-family: inherit; background: #fff; color: var(--ink);
  transition: border-color .15s, box-shadow .15s; }
textarea { resize: vertical; min-height: 76px; line-height: 1.55; }
.input:focus, textarea:focus { outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-light); }
.template-tokens { display: flex; flex-wrap: wrap; gap: 6px; margin: 9px 0; }
.template-token { border: 1px solid #c9d8ff; border-radius: 999px; background: #f4f7ff;
  color: var(--primary); padding: 5px 9px; font: 550 11.5px/1.2 var(--font); cursor: pointer;
  transition: border-color .15s, background .15s, transform .08s; }
.template-token:hover { border-color: var(--primary); background: var(--primary-light); }
.template-token:active { transform: scale(.97); }
.template-token:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 1px; }
.template-token strong { margin-left: 4px; font-weight: 650; color: var(--ink-2); }
.signature-editor { width: 100%; min-height: 72px; padding: 8px 11px; border: 1px solid var(--line-2);
  border-radius: 10px; background: #fff; color: var(--ink); font-size: 13.5px; line-height: 2;
  white-space: pre-wrap; word-break: break-word; cursor: text; transition: border-color .15s, box-shadow .15s; }
.signature-editor:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.signature-editor:empty::before { content: attr(data-placeholder); color: var(--ink-3); pointer-events: none; }
.editor-token { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; margin: 0 2px;
  padding: 2px 5px 2px 7px; border: 1px solid #b9cbff; border-radius: 6px; background: var(--primary-light);
  color: var(--primary); font-size: 11.5px; line-height: 1.45; vertical-align: 1px; white-space: nowrap; }
.editor-token strong { color: var(--ink-2); font-weight: 650; }
.editor-token-remove { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 4px;
  color: #7b93c9; font-size: 13px; line-height: 1; cursor: pointer; }
.editor-token-remove:hover { background: rgba(51,112,255,.12); color: var(--primary); }
.field-note { color: var(--ink-3); font-size: 11px; margin-top: 5px; }

/* 周四尾缀：两个主模式共用，默认折叠 */
.thursday-box { margin-top: 18px; border: 1px solid var(--line); border-radius: 12px;
  background: #fafbfc; overflow: hidden; }
.thursday-toggle { min-height: 44px; padding: 10px 12px; margin: 0; display: flex; align-items: center;
  justify-content: space-between; gap: 12px; cursor: pointer; user-select: none; }
.thursday-toggle-copy { min-width: 0; display: flex; align-items: baseline; gap: 7px; }
.thursday-toggle-title { color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.thursday-toggle-note { color: var(--ink-3); font-size: 11px; font-weight: 400; white-space: nowrap; }
.thursday-switch { width: 32px; height: 18px; flex: 0 0 auto; appearance: none; border: 0;
  border-radius: 999px; background: #c9cdd4; position: relative; cursor: pointer; transition: background .16s; }
.thursday-switch::after { content: ""; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px;
  border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(20,28,48,.22); transition: transform .16s; }
.thursday-switch:checked { background: var(--primary); }
.thursday-switch:checked::after { transform: translateX(14px); }
.thursday-switch:focus-visible { outline: 3px solid var(--primary-light); outline-offset: 2px; }
.thursday-fields { padding: 0 12px 12px; border-top: 1px solid var(--line); }
.thursday-field { margin-top: 11px; }
.thursday-field > label { margin-bottom: 6px; }
.separator-options { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; }
.separator-option { min-width: 0; margin: 0; position: relative; cursor: pointer; }
.separator-option input { position: absolute; opacity: 0; pointer-events: none; }
.separator-option span { min-height: 30px; padding: 5px 4px; display: grid; place-items: center;
  border: 1px solid var(--line-2); border-radius: 8px; background: #fff; color: var(--ink-2);
  font-size: 11.5px; font-weight: 500; white-space: nowrap; transition: border-color .15s, color .15s, background .15s; }
.separator-option input:checked + span { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.separator-option input:focus-visible + span { outline: 3px solid var(--primary-light); outline-offset: 1px; }
.thursday-custom-sep { margin-top: 7px; }

/* icon picker */
.picker-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.picker-head label { margin: 0; }
.picker-clear { font-size: 11.5px; color: var(--primary); cursor: pointer; font-weight: 550; }
.search-box { position: relative; margin-bottom: 9px; }
.search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--ink-3); }
.search-box input { width: 100%; padding: 9px 12px 9px 33px; border: 1px solid var(--line-2);
  border-radius: 10px; font-size: 13.5px; font-family: inherit; color: var(--ink);
  transition: border-color .15s, box-shadow .15s; }
.search-box input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.picker-actions { display: flex; align-items: center; gap: 14px; }
.toggle { display: inline-flex; align-items: center; gap: 5px; margin: 0; font-size: 11.5px;
  font-weight: 500; color: var(--ink-2); cursor: pointer; user-select: none; }
.toggle input { width: 13px; height: 13px; accent-color: var(--primary); cursor: pointer; }
.icon-list { max-height: 320px; overflow-y: auto; padding: 2px 10px 10px; background: #fafbfc;
  border: 1px solid var(--line); border-radius: 12px; scrollbar-width: thin; scrollbar-color: #d3d7de transparent; }
.icon-list::-webkit-scrollbar { width: 8px; }
.icon-list::-webkit-scrollbar-thumb { background: #d3d7de; border-radius: 4px; border: 2px solid #fafbfc; }
.icon-list::-webkit-scrollbar-track { background: transparent; }
.cat { margin-top: 10px; }
.cat-header { font-size: 12px; font-weight: 600; color: #d6403a; background: #fdecec;
  padding: 5px 9px; border-radius: 7px; margin-bottom: 8px; }
.cat-icons { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: center; }
.ic { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 7px;
  cursor: pointer; transition: background .12s, box-shadow .12s; }
.ic:hover { background: #eef1f6; }
.ic.selected { background: var(--primary-light); box-shadow: inset 0 0 0 1.5px var(--primary); }
.ic-img { width: 20px; height: 20px; object-fit: contain; filter: var(--feishu-blue-filter); flex-shrink: 0; }
.ic-desc { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.icon-list.no-desc .ic-desc { display: none; }
.icon-list.no-desc .ic { padding: 5px; }
.icon-list.no-desc .ic-img { width: 22px; height: 22px; }
.grid-empty { text-align: center; color: var(--ink-3); font-size: 12.5px; padding: 26px 0; }

/* ---------- 个人主页签名预览 ---------- */
.preview-head { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.preview-label { font-size: 12px; color: var(--ink-3);
  display: flex; align-items: center; gap: 6px; }
.preview-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #34c759; }
.preview-state { flex: 0 0 auto; color: var(--primary); background: var(--primary-light); border-radius: 999px;
  padding: 2px 7px; font-size: 10.5px; font-weight: 550; }

.profile-main { padding: 0 18px 20px; }
.profile-avatar { width: 62px; height: 62px; border-radius: 50%; background: #fff; border: 3px solid #fff;
  box-shadow: 0 2px 10px rgba(20,28,48,.12); display: grid; place-items: center; font-size: 30px;
  margin-top: -31px; }
.profile-name { font-size: 18px; font-weight: 650; margin-top: 11px; color: var(--ink); }
.profile-sign { margin-top: 9px; min-height: 24px; font-size: 14.5px; color: var(--link);
  line-height: 1.45; word-break: break-word; overflow-wrap: anywhere; }
/* 飞书把链接图标和标题放在同一条行内文本流里：碰到右边界才自然换行。 */
#sign-text { white-space: pre-wrap; }
.sign-icon { display: inline-block; width: 17px; height: 17px; margin-right: 5px; object-fit: contain;
  vertical-align: -3px; filter: var(--feishu-blue-filter); }
.sign-hint { font-size: 11.5px; color: var(--ink-3); margin-top: 11px; padding-top: 11px;
  border-top: 1px dashed var(--line); }

.btn-primary { width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 11px;
  background: var(--primary); color: #fff; font-size: 14.5px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: background .16s, transform .08s; display: flex; align-items: center;
  justify-content: center; gap: 7px; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:active { transform: scale(.985); }
.btn-primary svg { width: 16px; height: 16px; }

details { margin-top: 14px; }
summary { cursor: pointer; user-select: none; font-size: 12px; color: var(--ink-3);
  list-style: none; padding: 4px 0; display: flex; align-items: center; gap: 5px; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸"; font-size: 9px; transition: transform .15s; }
details[open] summary::before { transform: rotate(90deg); }
.url-box { margin-top: 8px; background: #f6f7f9; border: 1px solid var(--line); border-radius: 9px;
  padding: 10px 12px; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11px;
  line-height: 1.55; color: var(--ink-2); word-break: break-all; max-height: 96px; overflow-y: auto; }

.footer { text-align: center; margin-top: 30px; font-size: 11.5px; color: var(--ink-3); }

/* toast */
.toast { position: fixed; left: 50%; bottom: 30px; transform: translate(-50%, 12px);
  background: rgba(31,35,41,.94); color: #fff; padding: 11px 20px; border-radius: 11px;
  max-width: calc(100vw - 28px); font-size: 13px; text-align: center;
  opacity: 0; pointer-events: none; transition: all .24s cubic-bezier(.2,.8,.3,1); z-index: 50; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 760px) {
  body { padding: 24px 14px 48px; }
  header { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 14px; }
  .seg { width: 100%; }
  .seg button { flex: 1; }
  .grid { grid-template-columns: 1fr; }
}
@media (max-width: 430px) {
  .separator-options { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .thursday-toggle-copy { gap: 5px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 7h16M4 12h10M4 17h7"/><circle cx="18.5" cy="16.5" r="3"/><path d="m21 19-1.6-1.6"/>
        </svg>
      </div>
      <div>
        <h1>飞书签名生成器</h1>
        <p>生成会自动更新的个性签名，粘到飞书签名栏</p>
      </div>
    </div>
    <div class="seg" id="seg" role="tablist" aria-label="签名类型">
      <button type="button" role="tab" aria-selected="true" data-mode="signature" class="active">入职时长</button>
      <button type="button" role="tab" aria-selected="false" data-mode="custom">自定义文字</button>
    </div>
  </header>

  <section id="main-view" aria-label="主签名生成器">
  <div class="grid">
    <!-- 左：表单 -->
    <div class="panel panel-pad">
      <div id="fields-signature">
        <div class="field">
          <label>入职日期</label>
          <input class="input" type="date" id="date" value="2025-04-28">
        </div>
        <div class="field">
          <label id="signature-editor-label">签名文案</label>

const DEFAULT_SIGNATURE_FORMAT = 'Lv. {等级} {日月星}（还需要 {剩余天数} 天升级至 Lv.{下一等级}）';

const renderSymbols = (m) => {
  if (m < 1) return '⭐';
  return ('👑'.repeat(Math.floor(m/36)) + '☀️'.repeat(Math.floor((m%36)/12))
    + '🌙'.repeat(Math.floor((m%12)/3)) + '⭐'.repeat(m%3)) || '⭐';
};
const daysInMonth = (year, month) => new Date(Date.UTC(year, month, 0)).getUTCDate();
const parseDateParts = (value) => {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value);
  if (!match) return null;
  const year = Number(match[1]), month = Number(match[2]), day = Number(match[3]);
  if (month < 1 || month > 12 || day < 1 || day > daysInMonth(year, month)) return null;
  return { year, month, day };
};
const dateNumber = (year, month, day) => Math.floor(Date.UTC(year, month - 1, day) / 86400000);
const getBeijingDateParts = (nowMs = Date.now()) => {
  const now = new Date(nowMs + 8 * 3600 * 1000);
  return { year: now.getUTCFullYear(), month: now.getUTCMonth() + 1, day: now.getUTCDate() };
};
const calculateTenure = (date, nowMs = Date.now()) => {
  const start = parseDateParts(date);
  if (!start) return null;
  const today = getBeijingDateParts(nowMs);
  const todayNo = dateNumber(today.year, today.month, today.day);
  const startNo = dateNumber(start.year, start.month, start.day);
  if (todayNo < startNo) return { level: 0, daysLeft: startNo - todayNo, nextLevel: 1 };

  const monthDiff = (today.year - start.year) * 12 + (today.month - start.month);
  const anniversaryDay = Math.min(start.day, daysInMonth(today.year, today.month));
  const reached = today.day >= anniversaryDay;
  const level = monthDiff + (reached ? 1 : 0);
  let nextYear = today.year, nextMonth = today.month;
  if (reached) {
    nextMonth += 1;
    if (nextMonth === 13) { nextMonth = 1; nextYear += 1; }
  }
  const nextDay = Math.min(start.day, daysInMonth(nextYear, nextMonth));
  return {
    level,
    daysLeft: dateNumber(nextYear, nextMonth, nextDay) - todayNo,
    nextLevel: level + 1
  };
};

      if (result.length + char.length > maxLength) return result;

    cursor = match.index + match[0].length;

  $('token-level-value').textContent = tenure ? tenure.level : '—';
  $('token-symbols-value').textContent = tenure ? renderSymbols(tenure.level) : '—';
  $('token-days-value').textContent = tenure ? `${tenure.daysLeft}天` : '—';
  $('token-next-value').textContent = tenure ? tenure.nextLevel : '—';
  signatureEditor.querySelectorAll('.editor-token').forEach(chip => updateEditorToken(chip, tenure));
};

/* ---------- 周四尾缀 + 签名行预览 ---------- */
const THURSDAY_SEPARATORS = {
  space: ' ',
  dot: ' · ',
  pipe: ' ｜ ',
  dash: ' — ',
  newline: '\n'
};
const getThursdaySettings = () => {
  const enabled = $('thursday-enabled').checked;
  const selected = document.querySelector('input[name="thursday-separator"]:checked');
  const type = selected ? selected.value : 'newline';
  const separator = type === 'custom' ? $('thursday-custom-separator').value : THURSDAY_SEPARATORS[type];
  return { enabled, text: $('thursday-text').value.trim(), separator: separator == null ? '' : separator, type };
};
const getBasePreviewText = () => (mode === 'custom')
  ? $('custom-text').value                                         // 空就是空，无占位
  : renderPreview($('date').value, serializeEditor());
const refreshSign = () => {
  refreshTokenValues();
  const baseText = getBasePreviewText();
  const thursday = getThursdaySettings();
  const hasVisibleBase = hasVisibleText(baseText);
  const text = thursday.enabled && thursday.text
    ? (hasVisibleBase ? `${baseText}${thursday.separator}${thursday.text}` : thursday.text)
    : baseText;
  $('sign-text').textContent = text;
  $('thursday-preview-state').hidden = !thursday.enabled;
  // 图标：选了图标就显图标；否则「有文字」才用链接符号兜底；全空则不显示任何图标
  const ic = $('sign-icon');
  if (selectedKey) { ic.src = IMG_BASE + selectedKey; ic.hidden = false; }
  else if (text) { ic.src = IMG_BASE + DEFAULT_LINK_ICON; ic.hidden = false; }
  else { ic.hidden = true; }
};

/* ---------- 图标列表（仿飞书之父：分类标题 + 行内图标&描述，全部可滚动+搜索） ---------- */
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const renderList = () => {
  const q = $('icon-search').value.trim().toLowerCase();
  const box = $('icon-list');
  box.classList.toggle('no-desc', !$('show-desc').checked);
  let html = '', count = 0;
  PRESETS.forEach((cat) => {
    if (cat._mosaic) return;   // 大图分类不显示（散块没意义）
    const name = (cat.name || '').replace(/\s+/g, ' ').trim();
    let imgs = cat.images || [];
    if (q) imgs = imgs.filter(i => (i.description || '').toLowerCase().includes(q) || name.toLowerCase().includes(q));
    if (!imgs.length) return;
    let inner = '';
    imgs.forEach(i => {
      count++;
      const sel = selectedKey === i.key ? ' selected' : '';
      inner += `<span class="ic${sel}" data-key="${esc(i.key)}" title="${esc(i.description)}"><img class="ic-img" loading="lazy" alt="" src="${IMG_BASE + i.key}"><span class="ic-desc">${esc(i.description)}</span></span>`;
    });
    html += `<div class="cat"><div class="cat-header">${esc(name)}</div><div class="cat-icons">${inner}</div></div>`;
  });
  box.innerHTML = count ? html : '<div class="grid-empty">没找到匹配的图标</div>';
};

$('icon-list').addEventListener('click', (e) => {
  const el = e.target.closest('.ic');
  if (!el) return;
  const k = el.dataset.key;
  selectedKey = (selectedKey === k ? '' : k);
  renderList(); refreshSign();
});
$('icon-search').addEventListener('input', renderList);
$('show-desc').addEventListener('change', renderList);
renderList();

/* ---------- 沉浸式：在妙笔里运行时，拉取当前访问者的真实头像和名字 ---------- */
(async () => {
  try {
    const m = window.magic;
    if (!m || typeof m.getCurrentUserInfo !== 'function') return;   // 非妙笔环境（如本地预览）→ 保持占位
    const u = m.currentUserInfo || await m.getCurrentUserInfo();
    if (!u) return;
    if (u.name) document.querySelectorAll('.profile-name').forEach(name => { name.textContent = u.name; });
    if (u.avatar_url) {
      document.querySelectorAll('.profile-avatar').forEach(av => {
        const img = document.createElement('img');
        img.src = u.avatar_url;
        img.alt = '';
        img.style.cssText = 'width:100%;height:100%;border-radius:50%;object-fit:cover';
        av.style.padding = '0';
        av.replaceChildren(img);
      });
    }
  } catch (e) { /* 拿不到就保持占位 */ }
})();

/* ---------- 模式切换 + 输入监听 ---------- */
$('seg').querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    mode = btn.dataset.mode;
    $('seg').querySelectorAll('button').forEach(b => {
      const active = b === btn;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', String(active));
    });
    $('fields-signature').hidden = mode !== 'signature';
    $('fields-custom').hidden = mode !== 'custom';
    refreshSign();
  });
});
['date', 'custom-text', 'custom-link'].forEach(id => $(id).addEventListener('input', refreshSign));
document.querySelectorAll('.template-token').forEach(button => {
  button.addEventListener('mousedown', event => event.preventDefault());
  button.addEventListener('click', () => insertEditorToken(button.dataset.token));
});
document.addEventListener('selectionchange', () => {
  const selection = window.getSelection();
  if (selection.rangeCount && signatureEditor.contains(selection.anchorNode)) {
    savedEditorRange = selection.getRangeAt(0).cloneRange();
  }
});
signatureEditor.addEventListener('beforeinput', event => {
  if (event.inputType === 'insertParagraph' || event.inputType === 'insertLineBreak') {
    event.preventDefault();
    insertTextAtEditorRange('\n');
    return;
  }
  if (event.inputType.startsWith('insert') && typeof event.data === 'string') {
    const range = editorRange();
    if (!fitsEditorLimit(range, event.data.length)) {
      event.preventDefault();
      toast(`文案最多 ${MAX_FORMAT_LENGTH} 个字`);
    }
  }
});
signatureEditor.addEventListener('paste', event => {
  event.preventDefault();
  insertTextAtEditorRange(event.clipboardData.getData('text/plain').replace(/\r\n?/g, '\n'));
});
signatureEditor.addEventListener('drop', event => {
  event.preventDefault();
  signatureEditor.focus();
  insertTextAtEditorRange(event.dataTransfer.getData('text/plain').replace(/\r\n?/g, '\n'));
});
signatureEditor.addEventListener('input', () => {
  const format = serializeEditor();
  if (format.length > MAX_FORMAT_LENGTH) {
    setEditorFormat(truncateFormat(format, MAX_FORMAT_LENGTH));
    toast(`文案最多 ${MAX_FORMAT_LENGTH} 个字`);
  }
  refreshEditor();
});
signatureEditor.addEventListener('mousedown', event => {
  if (event.target.closest('.editor-token-remove')) event.preventDefault();
});
signatureEditor.addEventListener('click', event => {
  const remove = event.target.closest('.editor-token-remove');
  if (remove) removeEditorToken(remove.closest('.editor-token'));
});
signatureEditor.addEventListener('keydown', event => {
  if (event.key !== 'Backspace' && event.key !== 'Delete') return;
  const selection = window.getSelection();
  if (!selection.rangeCount || !selection.isCollapsed) return;
  const range = selection.getRangeAt(0);
  let node = null;
  if (range.startContainer === signatureEditor) {
    node = event.key === 'Backspace'
      ? signatureEditor.childNodes[range.startOffset - 1]
      : signatureEditor.childNodes[range.startOffset];
  } else if (range.startContainer.nodeType === Node.TEXT_NODE) {
    const text = range.startContainer;
    if (event.key === 'Backspace' && range.startOffset === 0) node = text.previousSibling;
    if (event.key === 'Delete' && range.startOffset === text.data.length) node = text.nextSibling;
  }
  if (node && node.nodeType === Node.ELEMENT_NODE && node.classList.contains('editor-token')) {
    event.preventDefault();
    removeEditorToken(node);
  }
});
$('picker-clear').addEventListener('click', () => { selectedKey = ''; renderList(); refreshSign(); });

const syncThursdayControls = () => {
  const thursday = getThursdaySettings();
  $('thursday-fields').hidden = !thursday.enabled;
  $('thursday-enabled').setAttribute('aria-expanded', String(thursday.enabled));
  $('thursday-custom-separator').hidden = thursday.type !== 'custom';
  refreshSign();
};
$('thursday-enabled').addEventListener('change', syncThursdayControls);
$('thursday-text').addEventListener('input', refreshSign);
$('thursday-custom-separator').addEventListener('input', refreshSign);
document.querySelectorAll('input[name="thursday-separator"]').forEach(input => {
  input.addEventListener('change', syncThursdayControls);
});

/* ---------- 生成链接 ---------- */
const appendThursdayParams = (params) => {
  const thursday = getThursdaySettings();
  if (!thursday.enabled) return;
  params.set('thursday_text', thursday.text);
  params.set('thursday_sep', thursday.separator);
};
const buildUrl = () => {
  const link = (mode === 'custom' && $('custom-link').value.trim()) || DEFAULT_TARGET;
  // 自定义模式：只选了图标、不写字 → raw 链接（零宽标题 + 图标），签名里只显示一个图标
  if (mode === 'custom' && !hasVisibleText($('custom-text').value) && selectedKey) {
    const q = new URLSearchParams();
    q.set('fid', PREVIEW_FID); q.set('pv', PREVIEW_SCHEMA); q.set('raw', '1'); q.set('k', selectedKey); q.set('t', ''); q.set('u', link);
    appendThursdayParams(q);
    return `${MAGIC_BASE}/r?${q.toString()}`;
  }
  const p = new URLSearchParams();
  p.set('fid', PREVIEW_FID);
  p.set('pv', PREVIEW_SCHEMA);
  if (mode === 'custom') {
    p.set('text', $('custom-text').value);
  } else {
    p.set('date', $('date').value);
    p.set('format', serializeEditor());
  }
  if (selectedKey) p.set('k', selectedKey);
  p.set('u', link);
  appendThursdayParams(p);
  return `${MAGIC_BASE}/r?${p.toString()}`;
};

/* ---------- 复制 ---------- */
const toast = (msg) => { const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1900); };
const copyText = async (text) => {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; } } catch {}
  try {
    const ta = document.createElement('textarea'); ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0'; document.body.appendChild(ta);
    ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  } catch { return false; }
};
$('copy-action').addEventListener('click', async () => {
  const thursday = getThursdaySettings();
  if (thursday.enabled && !hasVisibleText(thursday.text)) {
    toast('请输入周四尾缀文字');
    $('thursday-text').focus();
    return;
  }
  if (mode === 'custom') { if (!hasVisibleText($('custom-text').value) && !selectedKey) { toast('请输入文字，或选一个图标'); return; } }
  else {
    if (!$('date').value) { toast('请先选择入职日期'); return; }
    if (!hasVisibleText(serializeEditor())) { toast('请输入签名文案'); signatureEditor.focus(); return; }
  }
  currentUrl = buildUrl();
  $('url-box').textContent = currentUrl;
  if (await copyText(currentUrl)) toast('✓ 已复制，粘到飞书个性签名栏');
  else { document.querySelector('details').open = true; toast('复制失败，请从下方手动复制'); }
});

const today = getBeijingDateParts();
$('date').max = `${today.year}-${String(today.month).padStart(2, '0')}-${String(today.day).padStart(2, '0')}`;
setEditorFormat(DEFAULT_SIGNATURE_FORMAT);
syncThursdayControls();
</script>
</body>
</html>
